<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" />
    <title>TsukiVox A 方案封面比例比较</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
        --page: #080b0b;
        --panel: #0b1010;
        --screen: #06100f;
        --surface: #101918;
        --surface-hover: #152321;
        --surface-raised: #182421;
        --line: #263432;
        --line-soft: #1a2725;
        --text: #f2f7f5;
        --text-secondary: #9aacaa;
        --text-faint: #667673;
        --accent: #34e8ba;
        --accent-soft: #103a30;
        --accent-ink: #03130f;
        --warm: #f2b56b;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--page);
        color: var(--text);
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
        letter-spacing: 0;
      }

      button {
        color: inherit;
      }

      svg {
        display: block;
        width: 1em;
        height: 1em;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .review-header {
        display: grid;
        grid-template-columns: minmax(240px, 1fr) auto;
        align-items: end;
        gap: 36px;
        max-width: 1380px;
        margin: 0 auto;
        padding: 28px 32px 20px;
        border-bottom: 1px solid var(--line-soft);
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 750;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 25px;
        line-height: 1.25;
      }

      .data-source {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 7px;
        color: var(--text-secondary);
        font-size: 12px;
      }

      .data-source::before {
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--warm);
        content: "";
      }

      .data-source.is-live::before {
        background: var(--accent);
      }

      .data-source.is-fallback::before {
        background: var(--warm);
      }

      .scheme-switcher {
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #050807;
      }

      .scheme-button {
        min-width: 132px;
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
      }

      .scheme-button:hover {
        background: var(--surface);
        color: var(--text);
      }

      .scheme-button[aria-selected="true"] {
        background: var(--accent);
        color: var(--accent-ink);
      }

      .scheme-button:focus-visible,
      .icon-button:focus-visible,
      .text-button:focus-visible,
      .search-button:focus-visible,
      .add-button:focus-visible,
      .switch:focus-visible {
        outline: 2px solid #b5ffed;
        outline-offset: 2px;
      }

      .review-meta {
        display: grid;
        grid-template-columns: 1.1fr 1fr 1fr;
        gap: 0;
        max-width: 1380px;
        margin: 0 auto;
        padding: 14px 32px 16px;
      }

      .meta-block {
        min-width: 0;
        padding-right: 26px;
      }

      .meta-block + .meta-block {
        padding-left: 26px;
        border-left: 1px solid var(--line-soft);
      }

      .meta-label {
        display: block;
        margin-bottom: 3px;
        color: var(--text-faint);
        font-size: 12px;
        font-weight: 700;
      }

      .meta-value {
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.5;
      }

      .meta-value strong {
        color: var(--text);
        font-weight: 720;
      }

      .preview-viewport {
        width: 100%;
        overflow-x: auto;
        padding: 22px 32px 36px;
      }

      .tablet {
        position: relative;
        width: 1080px;
        height: 608px;
        margin: 0 auto;
        padding: 18px;
        border: 1px solid #40504d;
        border-radius: 8px;
        background: #1b2322;
        box-shadow: 0 22px 54px rgba(0, 0, 0, 0.42);
      }

      .tablet::before {
        position: absolute;
        inset: 8px;
        border: 1px solid #2b3836;
        border-radius: 5px;
        content: "";
        pointer-events: none;
      }

      .screen {
        position: relative;
        display: grid;
        grid-template-rows: 48px 58px 1fr 48px;
        gap: 10px;
        width: 100%;
        height: 100%;
        overflow: hidden;
        padding: 17px 22px 18px;
        border-radius: 3px;
        background: var(--screen);
      }

      .app-header {
        display: flex;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--line-soft);
      }

      .app-header h2 {
        margin: 0;
        font-size: 23px;
        line-height: 1;
      }

      .icon-button,
      .add-button {
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        background: #030606;
        cursor: pointer;
      }

      .icon-button {
        width: 44px;
        height: 40px;
        color: var(--text);
        font-size: 22px;
      }

      .icon-button:hover,
      .text-button:hover {
        border-color: #3d504c;
        background: var(--surface-hover);
      }

      .search-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 14px;
      }

      .search-input {
        width: 100%;
        height: 50px;
        padding: 0 18px;
        border: 1px solid var(--line-soft);
        border-radius: 5px;
        outline: 0;
        background: var(--surface);
        color: var(--text);
        font-size: 17px;
        font-weight: 650;
      }

      .search-input:focus {
        border-color: var(--accent);
      }

      .ktv-control {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
        font-size: 15px;
        font-weight: 750;
      }

      .switch {
        position: relative;
        width: 54px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 15px;
        background: var(--accent-soft);
        cursor: pointer;
      }

      .switch::after {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--text-secondary);
        content: "";
        transition: left 130ms ease, background 130ms ease;
      }

      .switch[aria-checked="true"]::after {
        left: 28px;
        background: var(--accent);
      }

      .search-button {
        display: grid;
        place-items: center;
        width: 66px;
        height: 50px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
        font-size: 24px;
      }

      .search-button:hover {
        background: #83f7da;
      }

      .results-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 12px;
        min-height: 0;
      }

      .result-card {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        background: var(--surface);
        transition: border-color 130ms ease, background 130ms ease, transform 130ms ease;
      }

      .result-card:hover {
        z-index: 2;
        border-color: rgba(52, 232, 186, 0.72);
        background: var(--surface-hover);
        transform: translateY(-2px);
      }

      .cover {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #111817;
      }

      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 220ms ease;
      }

      .result-card:hover .cover img {
        transform: scale(1.025);
      }

      .duration {
        position: absolute;
        right: 8px;
        bottom: 7px;
        z-index: 2;
        padding: 3px 7px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 760;
        line-height: 1.25;
      }

      .result-copy {
        min-width: 0;
        min-height: 0;
      }

      .result-title {
        display: -webkit-box;
        overflow: hidden;
        color: var(--text);
        font-weight: 750;
        line-height: 1.34;
        -webkit-box-orient: vertical;
      }

      .result-author {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
        color: var(--text-secondary);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .author-icon {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
        fill: currentColor;
        stroke: none;
      }

      .add-button {
        width: 44px;
        height: 44px;
        color: var(--accent);
        font-size: 23px;
        transition: color 120ms ease, background 120ms ease, border-color 120ms ease;
      }

      .add-button:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: #8fffe2;
      }

      .add-button.is-added {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }

      .screen.ratio-pc .result-card,
      .screen.ratio-pad .result-card,
      .screen.ratio-phone .result-card {
        display: flex;
      }

      .screen.ratio-pc .cover,
      .screen.ratio-pad .cover,
      .screen.ratio-phone .cover {
        width: auto;
        height: 100%;
        flex: 0 0 auto;
        align-self: stretch;
      }

      .screen.ratio-pc .cover {
        aspect-ratio: 16 / 9;
      }

      .screen.ratio-pad .cover {
        aspect-ratio: 16 / 10;
      }

      .screen.ratio-phone .cover {
        aspect-ratio: 3 / 2;
      }

      .screen.ratio-pc .result-copy,
      .screen.ratio-pad .result-copy,
      .screen.ratio-phone .result-copy {
        display: grid;
        flex: 1 1 auto;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-rows: 1fr auto;
        gap: 8px 10px;
        padding: 14px 12px 12px 14px;
      }

      .screen.ratio-pc .result-title,
      .screen.ratio-pad .result-title,
      .screen.ratio-phone .result-title {
        grid-column: 1 / -1;
        align-self: start;
        font-size: 17px;
        -webkit-line-clamp: 3;
      }

      .screen.ratio-pc .result-author,
      .screen.ratio-pad .result-author,
      .screen.ratio-phone .result-author {
        align-self: center;
        font-size: 13px;
      }

      .screen.ratio-pc .add-button,
      .screen.ratio-pad .add-button,
      .screen.ratio-phone .add-button {
        align-self: end;
      }

      .footer {
        display: grid;
        grid-template-columns: auto auto 1fr auto;
        align-items: center;
        gap: 10px;
      }

      .text-button {
        min-width: 100px;
        height: 44px;
        padding: 0 17px;
        border: 1px solid var(--line-soft);
        border-radius: 6px;
        background: #030606;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 15px;
        font-weight: 700;
      }

      .text-button:disabled {
        border-color: #151d1c;
        color: #43504e;
        cursor: default;
      }

      .page-status {
        color: var(--text-secondary);
        font-size: 14px;
        text-align: center;
      }

      .scheme-note {
        position: absolute;
        top: 26px;
        right: 26px;
        z-index: 5;
        display: none;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: rgba(5, 8, 7, 0.9);
        color: var(--text-secondary);
        font-size: 12px;
      }

      @media (max-width: 900px) {
        .review-header {
          grid-template-columns: 1fr;
          align-items: start;
          padding-inline: 20px;
        }

        .scheme-switcher {
          width: 100%;
          overflow-x: auto;
        }

        .scheme-button {
          flex: 1 0 128px;
        }

        .review-meta {
          grid-template-columns: 1fr;
          padding-inline: 20px;
        }

        .meta-block {
          padding: 9px 0;
        }

        .meta-block + .meta-block {
          padding-left: 0;
          border-top: 1px solid var(--line-soft);
          border-left: 0;
        }

        .preview-viewport {
          padding-inline: 20px;
        }

        .tablet {
          margin-left: 0;
        }

        .scheme-note {
          display: block;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

            bvid: "BV1VMuP6dEEc",
            title: "【十万人合唱】春日影（4吉他+2鼓+2贝斯+1键盘+100001主唱）",
            author: "今天蕾姆醒了吗",
            coverUrl: "https://i1.hdslb.com/bfs/archive/d116d7449b809a9235ac5b45685dea3fedab8254.jpg",
            localCover: "search-results-2x2-assets/BV1VMuP6dEEc.jpg",
            durationSeconds: 256,
            durationText: "4:16",
            viewCount: 538,
            publishedAt: 1785841507,
            pageUrl: "https://www.bilibili.com/video/BV1VMuP6dEEc/"
          }
        ]
      };

      const screen = document.querySelector("#screen");
      const schemeButtons = [...document.querySelectorAll(".scheme-button")];
      const schemeName = document.querySelector("#scheme-name");
      const schemeSummary = document.querySelector("#scheme-summary");
      const schemeFit = document.querySelector("#scheme-fit");
      const schemeTradeoff = document.querySelector("#scheme-tradeoff");
      const resultsGrid = document.querySelector("#results-grid");
      const searchInput = document.querySelector(".search-input");
      const searchButton = document.querySelector(".search-button");
      const ktvSwitch = document.querySelector(".switch");
      const previousPageButton = document.querySelector("#previous-page");
      const nextPageButton = document.querySelector("#next-page");
      const clearSelectionButton = document.querySelector("#clear-selection");
      const pageStatus = document.querySelector("#page-status");
      const addedIds = new Set();

      function selectScheme(key) {
        const scheme = schemes[key];
        screen.className = `screen ratio-${key}`;
        schemeButtons.forEach((button) => {
          button.setAttribute("aria-selected", String(button.dataset.scheme === key));
        });
        schemeName.textContent = scheme.label;
        schemeSummary.textContent = scheme.summary;
        schemeFit.textContent = scheme.fit;
        schemeTradeoff.textContent = scheme.tradeoff;
      }

      schemeButtons.forEach((button) => {
        button.addEventListener("click", () => selectScheme(button.dataset.scheme));
      });

      function setAddButtonState(button, item) {
        const added = addedIds.has(item.bvid);
        button.classList.toggle("is-added", added);
        button.title = added ? "已加入队列" : "加入队列";
        button.setAttribute("aria-label", `${added ? "取消点播" : "点播"} ${item.title}`);
        button.innerHTML = added
          ? '<svg aria-hidden="true"><use href="#icon-check"></use></svg>'
          : '<svg aria-hidden="true"><use href="#icon-plus"></use></svg>';
      }

      function createResultCard(item) {
        const card = document.createElement("article");
        card.className = "result-card";

        const cover = document.createElement("div");
        cover.className = "cover";
        const image = document.createElement("img");
        image.src = item.localCover;
        image.alt = `${item.title} 封面`;
        const duration = document.createElement("span");
        duration.className = "duration";
        duration.textContent = item.durationText;
        cover.append(image, duration);

        const copy = document.createElement("div");
        copy.className = "result-copy";
        const title = document.createElement("div");
        title.className = "result-title";
        title.textContent = item.title;
        const author = document.createElement("div");
        author.className = "result-author";
        author.innerHTML = '<svg class="author-icon" aria-hidden="true"><use href="#icon-uploader"></use></svg>';
        author.append(document.createTextNode(item.author));
        const addButton = document.createElement("button");
        addButton.className = "add-button";
        addButton.type = "button";
        setAddButtonState(addButton, item);
        addButton.addEventListener("click", () => {
          if (addedIds.has(item.bvid)) {
            addedIds.delete(item.bvid);
          } else {
            addedIds.add(item.bvid);
          }
          setAddButtonState(addButton, item);
        });

        copy.append(title, author, addButton);
        card.append(cover, copy);
        return card;
      }

      function renderResults() {
        resultsGrid.replaceChildren(...searchResponse.items.map(createResultCard));
        pageStatus.textContent = `第 ${searchResponse.page} 页 · 共 ${searchResponse.total} 个结果`;
      }

      searchButton.addEventListener("click", () => {
        searchInput.value = searchResponse.query;
        renderResults();
      });
      ktvSwitch.addEventListener("click", () => {
        const nextValue = ktvSwitch.getAttribute("aria-checked") !== "true";
        ktvSwitch.setAttribute("aria-checked", String(nextValue));
      });
      previousPageButton.disabled = searchResponse.page <= 1;
      nextPageButton.disabled = !searchResponse.hasMore;
      nextPageButton.addEventListener("click", () => {
        pageStatus.textContent = "静态预览仅包含第 1 页真实数据";
      });
      clearSelectionButton.addEventListener("click", () => {
        addedIds.clear();
        renderResults();
      });

      renderResults();
    </script>
  </body>
</html>
