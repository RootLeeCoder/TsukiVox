<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" />
    <title>TsukiVox 队列抽屉与入队反馈</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
        --page: #080b0b;
        --screen: #06100f;
        --surface: #0c1715;
        --surface-raised: #111e1c;
        --surface-hover: #162622;
        --drawer: #0e1917;
        --line: #22322f;
        --line-strong: #354b47;
        --text: #eff7f4;
        --text-secondary: #94aaa5;
        --text-faint: #60736f;
        --accent: #3de5bd;
        --accent-strong: #86f9dc;
        --accent-surface: #0a3329;
        --accent-ink: #03130f;
        --warm: #f2b56b;
        --danger: #ee7070;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow-x: hidden;
        background: var(--page);
        color: var(--text);
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
        letter-spacing: 0;
      }

      button {
        color: inherit;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent-strong);
        outline-offset: 2px;
      }

      svg {
        display: block;
        width: 1em;
        height: 1em;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .prototype-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        width: min(1180px, calc(100% - 48px));
        min-height: 74px;
        margin: 0 auto;
        border-bottom: 1px solid #172321;
      }

      .prototype-title {
        display: flex;
        align-items: baseline;
        gap: 12px;
        min-width: 0;
      }

      .prototype-title strong {
        color: var(--accent);
        font-size: 13px;
        text-transform: uppercase;
      }

      .prototype-title h1 {
        margin: 0;
        overflow: hidden;
        font-size: 19px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .reset-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 116px;
        height: 40px;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #050908;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 13px;
        font-weight: 720;
      }

      .reset-button:hover {
        border-color: var(--line-strong);
        background: var(--surface);
        color: var(--text);
      }

      .reset-button svg {
        font-size: 17px;
      }

      .preview {
        display: grid;
        min-height: calc(100vh - 74px);
        place-items: center;
        padding: 32px 24px 44px;
      }

      .tablet {
        position: relative;
        width: min(1120px, 100%);
        aspect-ratio: 1080 / 608;
        min-height: 570px;
        padding: 18px;
        border: 1px solid #40504d;
        border-radius: 8px;
        background: #1b2322;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.5);
      }

      .tablet::before {
        position: absolute;
        inset: 8px;
        border: 1px solid #2b3836;
        border-radius: 5px;
        content: "";
        pointer-events: none;
      }

      .screen {
        position: relative;
        display: grid;
        grid-template-rows: 50px 56px 1fr 46px;
        gap: 10px;
        width: 100%;
        height: 100%;
        min-height: 534px;
        overflow: hidden;
        padding: 16px 22px 18px;
        border-radius: 3px;
        background: var(--screen);
      }

      .app-header {
        display: flex;
        align-items: center;
        gap: 13px;
        border-bottom: 1px solid #192724;
      }

      .app-header h2 {
        margin: 0;
        font-size: 22px;
        line-height: 1;
      }

      .header-spacer {
        flex: 1;
      }

      .service-status {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--text-secondary);
        font-size: 12px;
      }

      .service-status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
      }

      .icon-button,
      .search-button,
      .add-button,
      .drawer-action,
      .remove-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        cursor: pointer;
      }

      .icon-button {
        position: relative;
        width: 42px;
        height: 38px;
        flex: 0 0 auto;
        border: 1px solid var(--line);
        background: #030606;
        color: var(--text);
        font-size: 20px;
      }

      .icon-button:hover,
      .icon-button[aria-expanded="true"] {
        border-color: var(--line-strong);
        background: var(--surface-hover);
      }

      .queue-trigger {
        margin-left: 4px;
      }

      .queue-trigger::after {
        position: absolute;
        inset: -5px;
        border: 1px solid transparent;
        border-radius: 8px;
        content: "";
        pointer-events: none;
      }

      .queue-trigger.is-target::after {
        animation: target-ring 520ms ease-out;
      }

      .queue-badge {
        position: absolute;
        top: -7px;
        right: -7px;
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border: 2px solid var(--screen);
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 850;
        line-height: 1;
      }

      .queue-badge.is-bumping {
        animation: badge-bump 440ms cubic-bezier(0.2, 1.35, 0.45, 1);
      }

      .search-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 12px;
      }

      .search-input {
        width: 100%;
        height: 48px;
        padding: 0 17px;
        border: 1px solid var(--line);
        border-radius: 5px;
        outline: 0;
        background: var(--surface);
        color: var(--text);
        font-size: 16px;
        font-weight: 650;
      }

      .search-input:focus {
        border-color: var(--accent);
      }

      .ktv-control {
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--text-secondary);
        font-size: 14px;
        font-weight: 750;
      }

      .switch {
        position: relative;
        width: 52px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 14px;
        background: #133c33;
        cursor: pointer;
      }

      .switch::after {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--text-secondary);
        content: "";
        transition: left 140ms ease, background 140ms ease;
      }

      .switch[aria-checked="true"]::after {
        left: 28px;
        background: var(--accent);
      }

      .search-button {
        width: 62px;
        height: 48px;
        border: 0;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 22px;
      }

      .search-button:hover {
        background: var(--accent-strong);
      }

      .results-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 11px;
        min-height: 0;
      }

      .result-card {
        position: relative;
        display: grid;
        grid-template-columns: minmax(172px, 46%) minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
      }

      .result-card:hover,
      .result-card:focus-within {
        z-index: 2;
        border-color: rgba(61, 229, 189, 0.68);
        background: var(--surface-hover);
        transform: translateY(-2px);
      }

      .result-card.is-confirmed {
        border-color: rgba(61, 229, 189, 0.78);
        animation: card-confirm 520ms ease-out;
      }

      .cover {
        position: relative;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #111817;
      }

      .cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 220ms ease;
      }

      .result-card:hover .cover img {
        transform: scale(1.025);
      }

      .duration {
        position: absolute;
        right: 7px;
        bottom: 7px;
        padding: 3px 6px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.84);
        color: #fff;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        font-weight: 780;
      }

      .result-copy {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 88px;
        grid-template-rows: minmax(0, 1fr) 42px;
        gap: 7px 9px;
        min-width: 0;
        padding: 12px 11px 10px 13px;
      }

      .result-title {
        display: -webkit-box;
        grid-column: 1 / -1;
        overflow: hidden;
        color: var(--text);
        font-size: 15px;
        font-weight: 760;
        line-height: 1.34;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .result-author {
        align-self: center;
        min-width: 0;
        overflow: hidden;
        color: var(--text-secondary);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .result-author::before {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--accent);
        content: "";
        vertical-align: 1px;
      }

      .add-button {
        width: 88px;
        height: 42px;
        gap: 6px;
        align-self: end;
        border: 1px solid #27443d;
        background: #030807;
        color: var(--accent);
        font-size: 13px;
        font-weight: 760;
        transition: border-color 140ms ease, background 140ms ease, color 140ms ease, transform 140ms ease;
      }

      .add-button svg {
        font-size: 18px;
      }

      .add-button:hover {
        border-color: var(--accent);
        background: var(--accent-surface);
        color: var(--accent-strong);
        transform: translateY(-1px);
      }

      .add-button.is-added {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
        cursor: default;
      }

      .add-button.is-added:hover {
        transform: none;
      }

      .footer {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
      }

      .page-button {
        min-width: 94px;
        height: 42px;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #030606;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
      }

      .page-button:disabled {
        color: #44514e;
        cursor: default;
      }

      .page-status {
        margin: 0;
        color: var(--text-secondary);
        font-size: 13px;
        text-align: center;
      }

      .scrim {
        position: absolute;
        z-index: 20;
        inset: 0;
        border: 0;
        background: rgba(0, 0, 0, 0.56);
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 190ms ease;
      }

      .queue-drawer {
        position: absolute;
        z-index: 21;
        top: 0;
        right: 0;
        bottom: 0;
        display: grid;
        grid-template-rows: 68px auto minmax(0, 1fr) 70px;
        width: min(460px, 48%);
        border-left: 1px solid var(--line-strong);
        background: var(--drawer);
        box-shadow: -26px 0 60px rgba(0, 0, 0, 0.46);
        transform: translateX(104%);
        visibility: hidden;
        transition: transform 250ms cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s linear 250ms;
      }

      .screen.drawer-open .scrim {
        opacity: 1;
        pointer-events: auto;
      }

      .screen.drawer-open .queue-drawer {
        transform: translateX(0);
        visibility: visible;
        transition: transform 250ms cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s;
      }

      .drawer-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px 0 22px;
        border-bottom: 1px solid var(--line);
      }

      .drawer-header h3 {
        margin: 0;
        font-size: 20px;
      }

      .drawer-count {
        color: var(--text-secondary);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      .drawer-header .icon-button {
        margin-left: auto;
      }

      .now-playing {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        align-items: center;
        gap: 11px;
        min-height: 70px;
        margin: 0 22px;
        border-bottom: 1px solid var(--line);
      }

      .now-playing-cover,
      .queue-row-cover {
        overflow: hidden;
        border-radius: 5px;
        background: #15201e;
      }

      .now-playing-cover {
        width: 44px;
        height: 44px;
      }

      .now-playing-cover img,
      .queue-row-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .now-playing-copy,
      .queue-row-copy {
        min-width: 0;
      }

      .now-playing-copy strong,
      .queue-row-copy strong {
        display: block;
        overflow: hidden;
        font-size: 13px;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .now-playing-copy span,
      .queue-row-copy span {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        color: var(--text-secondary);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .playing-label {
        color: var(--accent);
        font-size: 11px;
        font-weight: 760;
      }

      .queue-list {
        min-height: 0;
        overflow-y: auto;
        padding: 6px 22px 0;
      }

      .queue-row {
        display: grid;
        grid-template-columns: 22px 46px minmax(0, 1fr) 36px;
        align-items: center;
        gap: 10px;
        min-height: 68px;
        border-bottom: 1px solid var(--line);
      }

      .queue-row.is-entering {
        animation: row-enter 360ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .queue-position {
        color: var(--text-faint);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .queue-row-cover {
        width: 46px;
        height: 42px;
      }

      .remove-button {
        width: 34px;
        height: 34px;
        border: 0;
        background: transparent;
        color: var(--text-faint);
        font-size: 17px;
      }

      .remove-button:hover {
        background: #251718;
        color: var(--danger);
      }

      .drawer-footer {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 12px 22px;
        border-top: 1px solid var(--line);
      }

      .drawer-summary {
        margin: 0;
        color: var(--text-secondary);
        font-size: 12px;
      }

      .drawer-action {
        height: 42px;
        padding: 0 14px;
        border: 1px solid var(--line-strong);
        background: #07100e;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 720;
      }

      .drawer-action:hover:not(:disabled) {
        border-color: #6f3838;
        color: #ff9c9c;
      }

      .drawer-action:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .confirmation {
        position: absolute;
        z-index: 18;
        top: 18px;
        right: 72px;
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto;
        align-items: center;
        gap: 9px;
        width: min(430px, calc(100% - 44px));
        min-height: 46px;
        padding: 5px 7px 5px 9px;
        border: 1px solid rgba(61, 229, 189, 0.7);
        border-radius: 7px;
        background: #0a211c;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-10px);
        transition: opacity 170ms ease, transform 170ms ease;
      }

      .confirmation.is-visible {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .confirmation-icon {
        display: grid;
        width: 28px;
        height: 28px;
        place-items: center;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 16px;
      }

      .confirmation-copy {
        min-width: 0;
      }

      .confirmation-copy strong,
      .confirmation-copy span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .confirmation-copy strong {
        font-size: 13px;
      }

      .confirmation-copy span {
        margin-top: 2px;
        color: var(--text-secondary);
        font-size: 11px;
      }

      .view-queue-button {
        height: 34px;
        padding: 0 12px;
        border: 0;
        border-radius: 5px;
        background: var(--accent);
        color: var(--accent-ink);
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
      }

      .view-queue-button:hover {
        background: var(--accent-strong);
      }

      .flying-song {
        position: fixed;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 46px;
        overflow: hidden;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: #10241f;
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.48);
        color: var(--text);
        pointer-events: none;
        will-change: transform, opacity;
      }

      .flying-song img {
        width: 62px;
        height: 46px;
        flex: 0 0 auto;
        object-fit: cover;
      }

      .flying-song span {
        max-width: 124px;
        padding-right: 10px;
        overflow: hidden;
        font-size: 11px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .empty-queue {
        display: grid;
        min-height: 154px;
        place-items: center;
        color: var(--text-secondary);
        font-size: 13px;
        text-align: center;
      }

      @keyframes badge-bump {
        0% { transform: scale(1); }
        45% { transform: scale(1.42); }
        100% { transform: scale(1); }
      }

      @keyframes target-ring {
        0% { border-color: var(--accent); opacity: 0; transform: scale(0.82); }
        32% { opacity: 1; }
        100% { border-color: var(--accent); opacity: 0; transform: scale(1.28); }
      }

      @keyframes card-confirm {
        0% { box-shadow: 0 0 0 0 rgba(61, 229, 189, 0); }
        34% { box-shadow: 0 0 0 3px rgba(61, 229, 189, 0.3); }
        100% { box-shadow: 0 0 0 0 rgba(61, 229, 189, 0); }
      }

      @keyframes row-enter {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @media (max-width: 900px) {
        .prototype-header {
          width: calc(100% - 32px);
        }

        .prototype-title strong {
          display: none;
        }

        .preview {
          display: block;
          overflow-x: auto;
          padding: 24px 16px 36px;
        }

        .tablet {
          width: 880px;
          min-height: 570px;
        }

        .result-card {
          grid-template-columns: 45% minmax(0, 1fr);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }

        .flying-song {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M12 5v14"></path></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"></path></symbol>
      <symbol id="icon-list-music" viewBox="0 0 24 24"><path d="M21 15V6"></path><path d="M18.5 18.5A2.5 2.5 0 1 0 21 16v-1"></path><path d="M3 5h11M3 9h11M3 13h8M3 17h6"></path></symbol>
      <symbol id="icon-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path><path d="M10 11v5M14 11v5"></path></symbol>
      <symbol id="icon-rotate" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></symbol>
    </svg>

    <header class="prototype-header">
      <div class="prototype-title">
        <strong>TsukiVox Interaction Prototype</strong>
        <h1>播放队列抽屉与入队反馈</h1>
      </div>
      <button class="reset-button" id="reset-demo" type="button">
        <svg aria-hidden="true"><use href="#icon-rotate"></use></svg>
        重置演示
      </button>
    </header>

    <main class="preview">
      <section class="tablet" aria-label="TsukiVox 搜索点歌交互预览">
        <div class="screen" id="screen">
          <header class="app-header">
            <button class="icon-button" type="button" aria-label="返回" title="返回">
              <svg aria-hidden="true"><use href="#icon-arrow-left"></use></svg>
            </button>
            <h2>搜索点歌</h2>
            <span class="header-spacer"></span>
            <span class="service-status">点歌服务已连接</span>
            <button class="icon-button queue-trigger" id="queue-trigger" type="button" aria-label="打开播放队列" aria-expanded="false" aria-controls="queue-drawer" title="播放队列">
              <svg aria-hidden="true"><use href="#icon-list-music"></use></svg>
              <span class="queue-badge" id="queue-badge">3</span>
            </button>
          </header>

          <div class="search-row">
            <input class="search-input" value="春日影" aria-label="歌曲搜索词" />
            <div class="ktv-control">
              <span>KTV</span>
              <button class="switch" type="button" role="switch" aria-checked="false" aria-label="追加 KTV 关键词"></button>
            </div>
            <button class="search-button" type="button" aria-label="搜索" title="搜索">
              <svg aria-hidden="true"><use href="#icon-search"></use></svg>
            </button>
          </div>

          <section class="results-grid" id="results-grid" aria-label="搜索结果"></section>

          <footer class="footer">
            <button class="page-button" type="button" disabled>上一页</button>
            <p class="page-status">第 1 页 · 共 1000 个结果</p>
            <button class="page-button" type="button">下一页</button>
          </footer>

          <div class="confirmation" id="confirmation" role="status" aria-live="polite">
            <span class="confirmation-icon"><svg aria-hidden="true"><use href="#icon-check"></use></svg></span>
            <span class="confirmation-copy">
              <strong id="confirmation-title">已加入播放队列</strong>
              <span id="confirmation-detail">将在 2 首后播放</span>
            </span>
            <button class="view-queue-button" id="view-queue" type="button">查看队列</button>
          </div>

          <button class="scrim" id="scrim" type="button" aria-label="关闭播放队列"></button>

          <aside class="queue-drawer" id="queue-drawer" aria-label="播放队列" aria-hidden="true">
            <header class="drawer-header">
              <h3>播放队列</h3>
              <span class="drawer-count" id="drawer-count">3 首</span>
              <button class="icon-button" id="close-drawer" type="button" aria-label="关闭播放队列" title="关闭">
                <svg aria-hidden="true"><use href="#icon-x"></use></svg>
              </button>
            </header>

            <div class="now-playing">
              <span class="now-playing-cover"><img src="search-results-2x2-assets/BV1wJ4m1v7p2.jpg" alt="春日影封面" /></span>
              <span class="now-playing-copy"><strong>春日影</strong><span>MyGO!!!!! · 4:20</span></span>
              <span class="playing-label">正在播放</span>
            </div>

            <div class="queue-list" id="queue-list"></div>

            <footer class="drawer-footer">
              <p class="drawer-summary" id="drawer-summary">还有 2 首待播</p>
              <button class="drawer-action" id="clear-queue" type="button">清空待播</button>
            </footer>
          </aside>
        </div>
      </section>
    </main>

    <script>
      const assetsPath = "search-results-2x2-assets/";
      const songs = [
        {
          id: "crychic",
          title: "春日影（CRYCHIC ver.）完整重制版",
          author: "常三赵纸龙",
          duration: "4:14",
          image: assetsPath + "BV1VMuP6dEEc.jpg"
        },
        {
          id: "official",
          title: "【Official Music Video】春日影 (MyGO!!!!! ver.)",
          author: "MyGO_AveMujica",
          duration: "4:20",
          image: assetsPath + "BV1wJ4m1v7p2.jpg"
        },
        {
          id: "band-dream",
          title: "春日影 (MyGO!!!!! ver.)【BanG Dream!】动态鼓谱",
          author: "看破爱随风",
          duration: "4:17",
          image: assetsPath + "BV1JHLUz4EUy.jpg"
        },
        {
          id: "chorus",
          title: "【十万人合唱】春日影（4声部 + 2鼓 + 2贝斯）",
          author: "今天莹娜醒了吗",
          duration: "4:16",
          image: assetsPath + "BV1Ex4y1z7FU.jpg"
        }
      ];

      const initialQueue = [
        {
          id: "queue-1",
          title: "影色舞",
          author: "MyGO!!!!!",
          duration: "3:48",
          image: assetsPath + "BV1JHLUz4EUy.jpg"
        },
        {
          id: "queue-2",
          title: "迷星叫",
          author: "MyGO!!!!!",
          duration: "3:31",
          image: assetsPath + "BV1Ex4y1z7FU.jpg"
        }
      ];

      const screen = document.getElementById("screen");
      const resultsGrid = document.getElementById("results-grid");
      const queueTrigger = document.getElementById("queue-trigger");
      const queueBadge = document.getElementById("queue-badge");
      const drawer = document.getElementById("queue-drawer");
      const drawerCount = document.getElementById("drawer-count");
      const drawerSummary = document.getElementById("drawer-summary");
      const queueList = document.getElementById("queue-list");
      const confirmation = document.getElementById("confirmation");
      const confirmationTitle = document.getElementById("confirmation-title");
      const confirmationDetail = document.getElementById("confirmation-detail");
      const clearQueueButton = document.getElementById("clear-queue");
      let queue = initialQueue.map((item) => ({ ...item }));
      let confirmationTimer = 0;

      function icon(name) {
        return `<svg aria-hidden="true"><use href="#icon-${name}"></use></svg>`;
      }

      function renderResults() {
        resultsGrid.innerHTML = songs.map((song) => `
          <article class="result-card" data-song-id="${song.id}">
            <div class="cover">
              <img src="${song.image}" alt="${song.title} 封面" />
              <span class="duration">${song.duration}</span>
            </div>
            <div class="result-copy">
              <strong class="result-title">${song.title}</strong>
              <span class="result-author">${song.author}</span>
              <button class="add-button" type="button" data-add-song="${song.id}" aria-label="点播 ${song.title}">
                ${icon("plus")}<span>点歌</span>
              </button>
            </div>
          </article>
        `).join("");
      }

      function renderQueue(enteringId = "") {
        if (queue.length === 0) {
          queueList.innerHTML = '<div class="empty-queue">待播队列为空</div>';
        } else {
          queueList.innerHTML = queue.map((song, index) => `
            <div class="queue-row${song.id === enteringId ? " is-entering" : ""}" data-queue-id="${song.id}">
              <span class="queue-position">${index + 1}</span>
              <span class="queue-row-cover"><img src="${song.image}" alt="" /></span>
              <span class="queue-row-copy"><strong>${song.title}</strong><span>${song.author} · ${song.duration}</span></span>
              <button class="remove-button" type="button" data-remove-song="${song.id}" aria-label="从队列移除 ${song.title}" title="移除">
                ${icon("x")}
              </button>
            </div>
          `).join("");
        }

        const total = queue.length + 1;
        queueBadge.textContent = String(total);
        drawerCount.textContent = `${total} 首`;
        drawerSummary.textContent = queue.length > 0 ? `还有 ${queue.length} 首待播` : "当前歌曲播放结束后停止";
        clearQueueButton.disabled = queue.length === 0;
      }

      function openDrawer() {
        window.clearTimeout(confirmationTimer);
        confirmation.classList.remove("is-visible");
        screen.classList.add("drawer-open");
        queueTrigger.setAttribute("aria-expanded", "true");
        queueTrigger.setAttribute("aria-label", "关闭播放队列");
        drawer.setAttribute("aria-hidden", "false");
        window.setTimeout(() => document.getElementById("close-drawer").focus(), 260);
      }

      function closeDrawer(restoreFocus = true) {
        screen.classList.remove("drawer-open");
        queueTrigger.setAttribute("aria-expanded", "false");
        queueTrigger.setAttribute("aria-label", "打开播放队列");
        drawer.setAttribute("aria-hidden", "true");
        if (restoreFocus) {
          queueTrigger.focus();
        }
      }

      function showConfirmation(song) {
        window.clearTimeout(confirmationTimer);
        confirmationTitle.textContent = `《${song.title}》已加入`;
        confirmationDetail.textContent = `将在 ${queue.length} 首后播放`;
        confirmation.classList.add("is-visible");
        confirmationTimer = window.setTimeout(() => {
          confirmation.classList.remove("is-visible");
        }, 6500);
      }

      function animateSongToQueue(card, song) {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          return;
        }

        const cover = card.querySelector(".cover");
        const start = cover.getBoundingClientRect();
        const target = queueTrigger.getBoundingClientRect();
        const flyer = document.createElement("div");
        flyer.className = "flying-song";
        flyer.style.left = `${start.left + start.width * 0.42}px`;
        flyer.style.top = `${start.top + start.height * 0.5 - 23}px`;
        flyer.innerHTML = `<img src="${song.image}" alt="" /><span>${song.title}</span>`;
        document.body.appendChild(flyer);

        const flyerRect = flyer.getBoundingClientRect();
        const deltaX = target.left + target.width / 2 - flyerRect.left - flyerRect.width / 2;
        const deltaY = target.top + target.height / 2 - flyerRect.top - flyerRect.height / 2;
        const bendY = Math.min(-70, deltaY * 0.18 - 42);

        const animation = flyer.animate([
          { transform: "translate(0, 0) scale(0.92)", opacity: 0 },
          { transform: "translate(0, -8px) scale(1)", opacity: 1, offset: 0.16 },
          { transform: `translate(${deltaX * 0.55}px, ${bendY}px) scale(0.82)`, opacity: 1, offset: 0.58 },
          { transform: `translate(${deltaX}px, ${deltaY}px) scale(0.24)`, opacity: 0.3 }
        ], {
          duration: 720,
          easing: "cubic-bezier(0.22, 0.7, 0.18, 1)",
          fill: "forwards"
        });

        animation.finished.finally(() => flyer.remove());
      }

      function addSong(button) {
        if (button.classList.contains("is-added")) {
          return;
        }

        const song = songs.find((item) => item.id === button.dataset.addSong);
        const card = button.closest(".result-card");
        if (!song || !card) {
          return;
        }

        queue.push({ ...song });
        button.classList.add("is-added");
        button.disabled = true;
        button.innerHTML = `${icon("check")}<span>已加入</span>`;
        card.classList.add("is-confirmed");
        window.setTimeout(() => card.classList.remove("is-confirmed"), 540);

        animateSongToQueue(card, song);
        window.setTimeout(() => {
          renderQueue(song.id);
          queueBadge.classList.remove("is-bumping");
          queueTrigger.classList.remove("is-target");
          void queueBadge.offsetWidth;
          queueBadge.classList.add("is-bumping");
          queueTrigger.classList.add("is-target");
          showConfirmation(song);
        }, 570);
      }

      function removeSong(songId) {
        queue = queue.filter((song) => song.id !== songId);
        const resultButton = document.querySelector(`[data-add-song="${songId}"]`);
        if (resultButton) {
          resultButton.disabled = false;
          resultButton.classList.remove("is-added");
          resultButton.innerHTML = `${icon("plus")}<span>点歌</span>`;
        }
        renderQueue();
      }

      function resetDemo() {
        window.clearTimeout(confirmationTimer);
        confirmation.classList.remove("is-visible");
        closeDrawer(false);
        queue = initialQueue.map((item) => ({ ...item }));
        renderResults();
        renderQueue();
      }

      resultsGrid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-add-song]");
        if (button) {
          addSong(button);
        }
      });

      queueList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-remove-song]");
        if (button) {
          removeSong(button.dataset.removeSong);
        }
      });

      queueTrigger.addEventListener("click", () => {
        if (screen.classList.contains("drawer-open")) {
          closeDrawer();
        } else {
          openDrawer();
        }
      });

      document.getElementById("close-drawer").addEventListener("click", () => closeDrawer());
      document.getElementById("scrim").addEventListener("click", () => closeDrawer());
      document.getElementById("view-queue").addEventListener("click", openDrawer);
      document.getElementById("reset-demo").addEventListener("click", resetDemo);

      document.querySelector(".switch").addEventListener("click", (event) => {
        const button = event.currentTarget;
        button.setAttribute("aria-checked", button.getAttribute("aria-checked") === "true" ? "false" : "true");
      });

      clearQueueButton.addEventListener("click", () => {
        queue.forEach((song) => {
          const resultButton = document.querySelector(`[data-add-song="${song.id}"]`);
          if (resultButton) {
            resultButton.disabled = false;
            resultButton.classList.remove("is-added");
            resultButton.innerHTML = `${icon("plus")}<span>点歌</span>`;
          }
        });
        queue = [];
        renderQueue();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && screen.classList.contains("drawer-open")) {
          closeDrawer();
        }
      });

      renderResults();
      renderQueue();
    </script>
  </body>
</html>
